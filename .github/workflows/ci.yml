name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-dsp:
    name: C11 DSP & Vision (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S dsp -B dsp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP library and tests
        run: cmake --build dsp/build --config Release

      - name: Run CTest
        run: ctest --test-dir dsp/build -C Release --output-on-failure

  rust-worker:
    name: Rust FFI & ML Worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang llvm libclang-dev python3-dev python3-numpy

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        id: setup-py-win
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip numpy

      - name: Configure Python environment for PyO3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHONHOME=$env:pythonLocation"
          Add-Content -Path $env:GITHUB_ENV -Value "PYO3_PYTHON=${{ steps.setup-py-win.outputs.python-path }}"

      - name: Configure Python environment for PyO3 (Linux)
        if: runner.os == 'Linux'
        run: echo "PYO3_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Check formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      - name: Run Cargo tests
        run: cargo test --manifest-path crates/Cargo.toml --verbose

      - name: Build release binaries
        run: cargo build --manifest-path crates/Cargo.toml --release

  go-gateway:
    name: Go Gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

      - name: Run Go race tests
        env:
          CGO_ENABLED: "1"
        run: go test -v -race ./...

  python-ml:
    name: Python Streaming ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Run pytest
        run: python -m pytest python/tests -v

  web-dashboard:
    name: Web Dashboard (TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run frontend unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  docker-verify:
    name: Docker Compose & Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          push: false

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          push: false
